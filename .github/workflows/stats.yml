name: Sync YouTube stats

# Pulls subscriber / view / like / comment counts into the DB so the
# dashboard (Vercel, read-only on the DB) can show live numbers. Cheap:
# no video stack, ~3 YouTube quota units per channel.
on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-stats.txt
      - run: pip install -r requirements-stats.txt
      - name: Sync stats
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/sync_youtube_stats.py
