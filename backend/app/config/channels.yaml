# Content Studio — Storique channel definitions (Phase 1)
#
# Each channel is pure config: same LangGraph pipeline, different niche.
# daily_cap is the shadowban fix — start conservative, raise only once a
# channel is warmed up and the Feedback/Competitor agents confirm it's safe.
#
# `persona` is the fixed brand identity shown on the story-card overlay
# during the hook (Milestone 5) — handle + a placeholder emoji avatar
# (rendered inside a colored circle by story_card_renderer.py, no real
# artwork needed). Names/emoji below are first-pass placeholders — rename
# freely before Milestone 5 lands.
#
# `voices` is a rotating pool, not one fixed narrator per channel — the
# Voice Agent picks randomly per run for variety. Same 3 Kokoro voices
# shared across every channel for now (verified good by ear: am_adam,
# af_heart, af_bella) — differentiate per niche later once more of
# Kokoro's ~19 American voices have been listened to.

channels:
  - key: cheats
    name: Cheats
    niche: "Cheating / infidelity confession stories"
    subreddits: ["survivinginfidelity", "relationship_advice", "cheating_stories"]
    voices: ["af_jessica"]
    daily_cap: 3
    background_queries: ["oddly satisfying soap cutting asmr", "kinetic sand cutting asmr", "hydraulic press satisfying asmr", "paint mixing satisfying asmr"]
    active: true
    persona:
      handle: "@CaughtTales"
      avatar_emoji: "💔"

  - key: tifu
    name: TIFU
    niche: "Today I F***ed Up — embarrassing/consequence stories"
    subreddits: ["tifu"]
    voices: ["af_jessica"]
    daily_cap: 3
    background_queries: ["minecraft parkour gameplay", "subway surfers gameplay", "gta 5 ramp jumps gameplay", "trackmania gameplay no commentary"]
    active: true
